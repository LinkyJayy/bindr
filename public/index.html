<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bindr</title>
  <meta name="description" content="Bindr: your PDF library in the cloud, with page turns that feel like paper.">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="/icons/icon-64.png">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Bindr">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <script>
    // Apply the app theme (Light / Dark / Automatic) before first paint.
    try { const t = localStorage.getItem('bindr:ui-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.ui = t; } catch {}
  </script>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="modulepreload" href="/js/app.js">
</head>
<body>
  <div id="app">
    <div class="splash"><img src="/icons/icon-192.png" alt="" width="72" height="72"></div>
  </div>

  <!-- Sign in / create account -->
  <template id="tpl-auth">
    <main class="auth">
      <div class="auth-card">
        <img class="auth-logo" src="/icons/icon-192.png" alt="" width="72" height="72">
        <h1>Bindr</h1>
        <p class="auth-sub">Your books, everywhere.</p>
        <div class="seg" role="tablist">
          <button type="button" class="seg-btn active" data-mode="login" role="tab">Sign in</button>
          <button type="button" class="seg-btn" data-mode="register" role="tab">Create account</button>
        </div>
        <form class="auth-form" novalidate>
          <label class="field only-register" hidden>
            <span>Name</span>
            <input name="name" autocomplete="name" maxlength="80" placeholder="Your name">
          </label>
          <label class="field">
            <span>Email</span>
            <input name="email" type="email" autocomplete="email" required placeholder="you@example.com">
          </label>
          <label class="field">
            <span>Password</span>
            <input name="password" type="password" autocomplete="current-password" required minlength="8" placeholder="At least 8 characters">
          </label>
          <p class="form-error" role="alert"></p>
          <button class="btn primary block" type="submit">Sign in</button>
        </form>
      </div>
    </main>
  </template>

  <!-- App shell: Kindle-style top bar, content, bottom navigation -->
  <template id="tpl-shell">
    <div class="shell">
      <header class="k-top">
        <button class="k-status" data-action="quick" aria-label="Quick settings" aria-expanded="false">
          <span class="k-clock"></span>
          <svg class="k-chev" viewBox="0 0 24 24" width="16" height="16"><path d="m6 9 6 6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        </button>
        <div class="k-searchrow">
          <label class="k-search">
            <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="2" fill="none"/><path d="m20 20-4.2-4.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <input type="search" placeholder="Search Bindr" aria-label="Search your library" autocomplete="off">
          </label>
          <button class="k-icon" data-action="upload" aria-label="Add books" title="Add books">
            <svg viewBox="0 0 24 24" width="24" height="24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
          </button>
          <button class="k-icon" data-action="more" aria-label="Menu" title="Menu">
            <svg viewBox="0 0 24 24" width="24" height="24"><circle cx="12" cy="5.5" r="1.9" fill="currentColor"/><circle cx="12" cy="12" r="1.9" fill="currentColor"/><circle cx="12" cy="18.5" r="1.9" fill="currentColor"/></svg>
          </button>
        </div>
      </header>

      <div class="k-quick-panel" hidden>
        <button class="k-quick-close" data-action="quick-close" aria-label="Close quick settings">
          <span class="k-clock"></span>
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="m6 15 6-6 6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        </button>
        <div class="k-quick-grid">
          <button class="k-quick-btn" data-quick="theme">
            <svg viewBox="0 0 24 24" width="26" height="26"><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg>
            <span>Dark Mode</span><small></small>
          </button>
          <button class="k-quick-btn" data-quick="eink">
            <svg viewBox="0 0 24 24" width="26" height="26"><rect x="5" y="2.8" width="14" height="18.4" rx="2" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M8.5 7h7M8.5 10.5h7M8.5 14h4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            <span>E-ink</span><small></small>
          </button>
          <button class="k-quick-btn" data-quick="sync">
            <svg viewBox="0 0 24 24" width="26" height="26"><path d="M20 8a8.5 8.5 0 0 0-15.3-1.5M4 16a8.5 8.5 0 0 0 15.3 1.5M20 3.5V8h-4.5M4 20.5V16h4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
            <span>Sync</span><small></small>
          </button>
          <button class="k-quick-btn" data-quick="upload">
            <svg viewBox="0 0 24 24" width="26" height="26"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5M4.5 15v4.5h15V15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
            <span>Add Books</span><small></small>
          </button>
          <button class="k-quick-btn" data-quick="settings">
            <svg viewBox="0 0 24 24" width="26" height="26"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <span>All Settings</span><small></small>
          </button>
        </div>
      </div>
      <div class="k-quick-scrim" hidden></div>

      <main class="k-main"></main>

      <nav class="k-bottom" aria-label="Main">
        <button data-nav="/" aria-label="Home">
          <svg viewBox="0 0 24 24" width="26" height="26"><path d="M3.5 11 12 4l8.5 7M6 9v11h4.5v-6h3v6H18V9" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" fill="none"/></svg>
          <span>Home</span>
        </button>
        <button class="k-current" data-current hidden>
          <span class="k-current-cover"></span>
          <span class="k-current-title"></span>
        </button>
        <button data-nav="/library" aria-label="Library">
          <svg viewBox="0 0 24 24" width="26" height="26"><path d="M4 4.5h3.5v15H4zM9.5 4.5H13v15H9.5zM15 5.6l3.3-.9 3.2 14.1-3.3.8z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" fill="none"/></svg>
          <span>Library</span>
        </button>
      </nav>

      <input type="file" class="file-input" accept="application/pdf,.pdf,application/epub+zip,.epub" multiple hidden>
      <div class="drop-overlay" hidden><div>Drop PDF or ePUB books to add them to your library</div></div>
    </div>
  </template>

  <!-- Reader -->
  <template id="tpl-reader">
    <div class="reader">
      <div class="stage">
        <canvas class="curl-canvas"></canvas>
        <div class="fallback-page" hidden></div>
        <div class="hl-layer" aria-hidden="true"></div>
        <div class="sel-layer" aria-hidden="true"></div>
        <div class="tts-highlight" aria-hidden="true"></div>
        <div class="hl-popup" role="toolbar" aria-label="Highlight" hidden></div>
        <div class="reader-loading"><div class="spinner"></div><p>Opening book…</p></div>
      </div>
      <button class="reader-status" type="button" aria-label="Reading progress (tap to switch)"></button>
      <header class="reader-bar top">
        <button class="icon-btn" data-action="close" aria-label="Back">
          <svg viewBox="0 0 24 24" width="24" height="24"><path d="m15 5-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        </button>
        <div class="reader-title"></div>
        <button class="icon-btn" data-action="listen" aria-label="Read aloud" title="Read aloud" aria-pressed="false" hidden>
          <svg viewBox="0 0 24 24" width="22" height="22"><rect x="9" y="3" width="6" height="11" rx="3" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>
        </button>
        <button class="icon-btn aa-btn" data-action="display" aria-label="Display settings" title="Display settings" aria-pressed="false">
          <span aria-hidden="true"><small>A</small>A</span>
        </button>
        <button class="icon-btn" data-action="menu" aria-label="Menu" title="Menu">
          <svg viewBox="0 0 24 24" width="24" height="24"><circle cx="12" cy="5.5" r="1.9" fill="currentColor"/><circle cx="12" cy="12" r="1.9" fill="currentColor"/><circle cx="12" cy="18.5" r="1.9" fill="currentColor"/></svg>
        </button>
      </header>

      <div class="display-panel" role="dialog" aria-label="Display settings" hidden>
        <div class="dp-tabs" role="tablist">
          <button class="dp-tab active" data-tab="themes" role="tab">Themes</button>
          <button class="dp-tab" data-tab="font" role="tab">Font</button>
          <button class="dp-tab" data-tab="layout" role="tab">Layout</button>
          <button class="dp-tab" data-tab="color" role="tab">Color</button>
          <button class="icon-btn dp-close" data-close aria-label="Close display settings">
            <svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
          </button>
        </div>
        <div class="dp-pane" data-pane="themes">
          <div class="dp-label">Page theme for this book</div>
          <div class="dp-options">
            <button class="dp-opt theme-light" data-theme-opt="light" role="radio"><span class="dp-swatch">Aa</span>Light</button>
            <button class="dp-opt theme-dark" data-theme-opt="dark" role="radio"><span class="dp-swatch">Aa</span>Dark</button>
          </div>
          <p class="dp-note">Dark recolors the page and its text but never the pictures. It's saved with this book only.</p>
        </div>
        <div class="dp-pane" data-pane="font" hidden>
          <div class="font-controls">
            <div class="dp-label">Font size</div>
            <div class="font-row">
              <button class="font-btn" data-font="down" aria-label="Smaller text"><span style="font-size:14px">A</span></button>
              <input class="font-range" type="range" min="13" max="34" step="1" aria-label="Font size">
              <button class="font-btn" data-font="up" aria-label="Larger text"><span style="font-size:24px">A</span></button>
              <span class="font-value"></span>
            </div>
            <p class="font-sample">The quick brown fox jumps over the lazy dog.</p>
          </div>
          <p class="dp-note font-pdf-note">PDF pages have a fixed layout, so their text can't be resized. Double-tap empty space on a page, or use Layout → Zoom, to make it bigger. Font size works with ePUB books.</p>
        </div>
        <div class="dp-pane" data-pane="layout" hidden>
          <div class="dp-label">Pages</div>
          <div class="dp-options">
            <button class="dp-opt" data-layout-opt="auto" role="radio">Automatic</button>
            <button class="dp-opt" data-layout-opt="single" role="radio">One page</button>
            <button class="dp-opt" data-layout-opt="double" role="radio">Two pages</button>
          </div>
          <p class="dp-note layout-note" hidden>Two pages need a wider screen.</p>
          <div class="dp-label">Page turn</div>
          <div class="dp-options">
            <button class="dp-opt" data-turn-opt="curl" role="radio">Curl</button>
            <button class="dp-opt" data-turn-opt="slide" role="radio">Slide</button>
            <button class="dp-opt" data-turn-opt="instant" role="radio">Instant</button>
          </div>
          <div class="zoom-section">
            <div class="dp-label">Zoom</div>
            <div class="dp-options">
              <button class="dp-opt" data-zoom-opt="page" role="radio">Fit page</button>
              <button class="dp-opt" data-zoom-opt="width" role="radio">Fit width</button>
            </div>
            <p class="dp-note">Tip: double-tap empty space on a page to switch zoom. Double-tap a word to look it up.</p>
          </div>
        </div>
        <div class="dp-pane" data-pane="color" hidden>
          <div class="fp-embed"></div>
        </div>
      </div>

      <div class="tts-player" role="region" aria-label="Read aloud" hidden>
        <div class="tts-text"><div class="tts-where"></div><div class="tts-caption" aria-live="polite"></div></div>
        <div class="tts-controls">
          <button class="icon-btn" data-tts="prev" aria-label="Previous sentence">
            <svg viewBox="0 0 24 24" width="22" height="22"><path d="M6 5v14M19 5.8v12.4a.8.8 0 0 1-1.2.7L9 12.7a.8.8 0 0 1 0-1.4l8.8-6.2a.8.8 0 0 1 1.2.7z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
          </button>
          <button class="icon-btn tts-play" data-tts="toggle" aria-label="Play"></button>
          <button class="icon-btn" data-tts="next" aria-label="Next sentence">
            <svg viewBox="0 0 24 24" width="22" height="22"><path d="M18 5v14M5 5.8v12.4a.8.8 0 0 0 1.2.7l8.8-6.2a.8.8 0 0 0 0-1.4L6.2 5.1A.8.8 0 0 0 5 5.8z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
          </button>
          <button class="tts-rate" data-tts="rate" aria-label="Reading speed">1×</button>
          <select class="tts-voice" aria-label="Voice"></select>
          <button class="icon-btn" data-tts="close" aria-label="Stop reading aloud">
            <svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
          </button>
        </div>
      </div>
      <footer class="reader-bar bottom">
        <input class="scrubber" type="range" min="1" max="1" value="1" aria-label="Page">
        <div class="page-label"></div>
      </footer>
    </div>
  </template>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
